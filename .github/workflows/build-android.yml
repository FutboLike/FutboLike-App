name: Generar APK FutboLike

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Copiar reproductor HLS
        run: cp node_modules/hls.js/dist/hls.min.js www/vendor/hls.min.js

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Aplicar configuración Android
        run: node scripts/configure-android.mjs

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Generar APK de prueba
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: FutboLike-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
