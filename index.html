<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reproductor TV</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080808;
        }

        .reproductor {
            width: min(100%, 1000px);
            background: #000;
        }

        video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #mensaje {
            color: white;
            padding: 12px;
            text-align: center;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

<div class="reproductor">
    <video id="video" controls autoplay muted playsinline></video>
    <div id="mensaje">Cargando transmisión...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>

<script>
const video = document.getElementById("video");
const mensaje = document.getElementById("mensaje");

const streamURL =
    "https://threeo-tv.cloud/live/ThreeoTV225/d8znVtex63/417204.ts";

if (mpegts.getFeatureList().mseLivePlayback) {
    const player = mpegts.createPlayer({
        type: "mpegts",
        isLive: true,
        url: streamURL
    }, {
        enableWorker: true,
        enableStashBuffer: false,
        stashInitialSize: 128
    });

    player.attachMediaElement(video);
    player.load();

    player.play()
        .then(() => {
            mensaje.style.display = "none";
        })
        .catch(() => {
            mensaje.textContent =
                "Presiona reproducir para iniciar la transmisión.";
        });

    player.on(mpegts.Events.ERROR, function(tipo, detalle) {
        console.error("Error:", tipo, detalle);
        mensaje.textContent =
            "No se pudo cargar la transmisión.";
    });
} else {
    mensaje.textContent =
        "Este navegador no admite transmisiones MPEG-TS.";
}
</script>

</body>
</html>
