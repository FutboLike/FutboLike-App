<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071426" />
  <title>FutboLike TV</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main id="app">
    <section id="welcomeScreen" class="screen welcome-screen">
      <div class="stadium-glow stadium-glow-left" aria-hidden="true"></div>
      <div class="stadium-glow stadium-glow-right" aria-hidden="true"></div>
      <div class="welcome-card">
        <div class="brand-panel">
          <div class="broadcast-label"><span></span> FUTBOLIKE TV</div>
          <img id="channelLogo" class="channel-logo hidden" alt="Logo del canal" />
          <div id="fallbackLogo" class="brand-ball" aria-hidden="true">⚽</div>
          <h1 id="channelName">FutboLike</h1>
          <p id="welcomeMessage">Bienvenidos a FutboLike, búscanos en redes sociales</p>
        </div>

        <div class="action-panel">
          <p class="ready-label">Tu canal está listo</p>
          <button id="watchButton" type="button">
            <span class="play-symbol" aria-hidden="true"></span>
            <span id="watchButtonLabel">Ver Canal</span>
          </button>

          <div id="socialSection" class="social-section hidden" aria-label="Redes sociales de FutboLike">
            <p id="socialMessage">Síguenos en redes sociales</p>
            <div class="social-buttons">
              <a id="instagramButton" class="social-button instagram hidden" href="#" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle class="icon-fill" cx="17.4" cy="6.7" r="1"></circle></svg>
                <span>Instagram</span>
              </a>
              <a id="facebookButton" class="social-button facebook hidden" href="#" target="_blank" rel="noopener noreferrer" aria-label="Abrir Facebook">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-fill" d="M14 8h3V4.2c-.5-.1-2.2-.2-4.1-.2C9 4 6.3 6.4 6.3 10.8V14H2v4.3h4.3V24h5.2v-5.7h4.2l.7-4.3h-4.9v-2.8C11.5 9.4 12 8 14 8Z"></path></svg>
                <span>Facebook</span>
              </a>
            </div>
          </div>

          <small id="startupStatus">Conectando con Firebase…</small>
        </div>
      </div>
    </section>

    <section id="playerScreen" class="screen player-screen hidden" aria-label="Canal FutboLike en vivo">
      <video id="videoPlayer" playsinline controls preload="auto"></video>

      <div id="liveBadge" class="live-badge">● EN VIVO</div>
      <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <p id="loadingText">Conectando con FutboLike…</p>
      </div>
      <div id="errorOverlay" class="overlay hidden">
        <p id="errorMessage">No fue posible cargar el canal.</p>
        <button id="retryButton" type="button">Reintentar</button>
      </div>
    </section>
  </main>

  <script src="./vendor/hls.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
